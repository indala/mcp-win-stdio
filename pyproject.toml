[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio"
version = "0.1.0"
description = "Windows-optimized Model Context Protocol (MCP) suite for local stdio execution (Excel COM automation, Workspace Explorer, and extensible plugins) with automated Claude setup."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "indala", email = "indala@example.com" }
]
keywords = ["mcp", "claude", "excel", "workspace-explorer", "stdio", "windows", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.2.0",
    "pathspec>=0.12.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
excel = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pywin32>=306; platform_system == 'Windows'",
]
explorer = [
    "pathspec>=0.12.0",
    "rapidfuzz>=3.0.0",
]
all = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pywin32>=306; platform_system == 'Windows'",
    "pathspec>=0.12.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
mcp-win-stdio = "mcp_win_stdio.cli:main"
mws = "mcp_win_stdio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]
