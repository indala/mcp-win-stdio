[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio"
version = "0.2.1"
description = "Windows-optimized Model Context Protocol (MCP) suite & interactive CLI hub for Claude Desktop & Claude Code CLI (Excel COM, Word layouts, Workspace Explorer, and TypeScript diagnostic watcher)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohan Kumar Indala" }
]
keywords = ["mcp", "claude", "windows", "excel", "word", "workspace-explorer", "typescript", "stdio", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
excel = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
    "pywin32>=306; platform_system == 'Windows'",
]
word = [
    "python-docx>=1.1.0",
    "pywin32>=306; platform_system == 'Windows'",
]
explorer = [
    "pathspec>=0.12.0",
    "rapidfuzz>=3.0.0",
]
tsc = [
    "mcp>=1.2.0",
]
db = [
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]
all = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
    "pywin32>=306; platform_system == 'Windows'",
    "python-docx>=1.1.0",
    "pathspec>=0.12.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]

[project.scripts]
mcp-win-stdio = "mcp_win_stdio.cli:main"
mws = "mcp_win_stdio.cli:main"
mws-excel = "mcp_win_stdio.excel.cli:main"
mcp-win-stdio-excel = "mcp_win_stdio.excel.cli:main"
mws-word = "mcp_win_stdio.word.cli:main"
mcp-win-stdio-word = "mcp_win_stdio.word.cli:main"
mws-explorer = "mcp_win_stdio.explorer.cli:main"
mcp-win-stdio-explorer = "mcp_win_stdio.explorer.cli:main"
mws-tsc = "mcp_win_stdio.tsc.cli:main"
mcp-win-stdio-tsc = "mcp_win_stdio.tsc.cli:main"
mws-db = "mcp_win_stdio.db.cli:main"
mcp-win-stdio-db = "mcp_win_stdio.db.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]
