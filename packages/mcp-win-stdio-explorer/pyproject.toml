[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio-explorer"
version = "0.1.0"
description = "Lightweight Model Context Protocol (MCP) server for token-safe workspace exploration: collapsible directory trees, dynamic .gitignore resolution, in-file grep, RapidFuzz fuzzy search, and AST code outline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "indala", email = "indala@example.com" }
]
keywords = ["mcp", "claude", "workspace", "explorer", "grep", "fuzzy-search", "gitignore", "ast", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.2.0",
    "pathspec>=0.12.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
mcp-win-stdio-explorer = "mcp_win_stdio.explorer.cli:main"
mws-explorer = "mcp_win_stdio.explorer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]
