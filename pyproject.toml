[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio"
version = "0.2.2"
description = "Windows-optimized Model Context Protocol (MCP) suite & interactive CLI hub for Claude Desktop & Claude Code CLI (Excel COM, Word layouts, Workspace Explorer, and TypeScript diagnostic watcher)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohan Kumar Indala" }
]
keywords = ["mcp", "claude", "windows", "excel", "word", "workspace-explorer", "typescript", "stdio", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
excel = [
    "mcp-win-stdio-excel>=0.2.2",
]
word = [
    "mcp-win-stdio-word>=0.2.2",
]
explorer = [
    "mcp-win-stdio-explorer>=0.2.2",
]
tsc = [
    "mcp-win-stdio-tsc>=0.2.2",
]
db = [
    "mcp-win-stdio-db>=0.2.2",
]
git = [
    "mcp-win-stdio-git>=0.2.2",
]
all = [
    "mcp-win-stdio-excel>=0.2.2",
    "mcp-win-stdio-word>=0.2.2",
    "mcp-win-stdio-explorer>=0.2.2",
    "mcp-win-stdio-tsc>=0.2.2",
    "mcp-win-stdio-db>=0.2.2",
    "mcp-win-stdio-git>=0.2.2",
]

[project.scripts]
mcp-win-stdio = "mcp_win_stdio.cli:main"
mws = "mcp_win_stdio.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]
exclude = [
    "src/mcp_win_stdio/excel",
    "src/mcp_win_stdio/word",
    "src/mcp_win_stdio/explorer",
    "src/mcp_win_stdio/tsc",
    "src/mcp_win_stdio/db",
    "src/mcp_win_stdio/git",
]

