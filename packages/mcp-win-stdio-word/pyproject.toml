[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio-word"
version = "0.2.1"
description = "Windows-optimized Model Context Protocol (MCP) server for Word documents: 10 tools for multi-unit margins, multi-column layout, paragraph spacing/indentation, typography, images, and tables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohan Kumar Indala" }
]
keywords = ["mcp", "claude", "word", "docx", "margins", "typography", "layout", "windows", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]


dependencies = [
    "mcp>=1.2.0",
    "python-docx>=1.1.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
mcp-win-stdio-word = "mcp_win_stdio.word.cli:main"
mws-word = "mcp_win_stdio.word.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]
