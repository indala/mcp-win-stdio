[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio-git"
version = "0.2.4"
description = "Unified Git & GitHub Model Context Protocol (MCP) server for Windows & Claude: 33 tools combining local Git repository management (init, remotes, restore, bookmarks, branching, commits, diffs) and remote GitHub CLI (gh) operations with hybrid synergy workflows."
readme = "README.md"

requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohan Kumar Indala" }
]
keywords = ["mcp", "claude", "git", "github", "gh", "version-control", "pull-requests", "issues", "actions", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "mcp-win-stdio>=0.2.4",
    "mcp>=1.2.0",
]

[project.scripts]
mcp-win-stdio-git = "mcp_win_stdio.git.cli:main"
mws-git = "mcp_win_stdio.git.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]
