name: Release & Publish to PyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build All 7 Packages & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine hatchling

      - name: Run Test Suite
        run: |
          pip install mcp rapidfuzz pathspec openpyxl pandas python-docx psycopg2-binary pymysql paramiko cryptography
          python tests/test_cli.py
          python tests/test_audit.py

      - name: Build All 8 Packages (Root + Subpackages)
        run: python scripts/build_all.py

      - name: Check Artifact Metadata
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            echo "Publishing packages to PyPI (skipping already published releases)..."
            for f in dist/*; do
              echo "Uploading $f..."
              for attempt in 1 2 3 4 5; do
                if twine upload --skip-existing "$f"; then
                  break
                else
                  echo "Upload failed (possibly rate limit), retrying in 10s... (attempt $attempt/5)"
                  sleep 10
                fi
              done
              sleep 3
            done
          else
            echo "::warning ::PYPI_API_TOKEN secret is not set in GitHub repository settings. Skipping PyPI upload."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
