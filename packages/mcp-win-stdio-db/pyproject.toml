[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio-db"
version = "0.1.0"
description = "Unified Database Model Context Protocol (MCP) server for PostgreSQL & MySQL: 20 tools for multi-server querying, DBA operations (create, drop, clone, dump, terminate), and cross-schema auto-resolution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohan Kumar Indala" }
]
keywords = ["mcp", "claude", "database", "postgres", "postgresql", "mysql", "mariadb", "dba", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

dependencies = [
    "mcp>=1.2.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]

[project.scripts]
mcp-win-stdio-db = "mcp_win_stdio.db.cli:main"
mws-db = "mcp_win_stdio.db.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]
