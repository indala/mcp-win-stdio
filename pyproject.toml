[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio"
version = "0.2.5"
description = "Windows-optimized Model Context Protocol (MCP) suite & interactive CLI hub for Claude Desktop & Claude Code CLI (Excel COM, Word layouts, Workspace Explorer, and TypeScript diagnostic watcher)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohan Kumar Indala" }
]
keywords = ["mcp", "claude", "windows", "excel", "word", "workspace-explorer", "typescript", "stdio", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
excel = [
    "mcp-win-stdio-excel>=0.2.5",
]
word = [
    "mcp-win-stdio-word>=0.2.5",
]
explorer = [
    "mcp-win-stdio-explorer>=0.2.5",
]
tsc = [
    "mcp-win-stdio-tsc>=0.2.5",
]
db = [
    "mcp-win-stdio-db>=0.2.5",
]
git = [
    "mcp-win-stdio-git>=0.2.5",
]
ssh = [
    "mcp-win-stdio-ssh>=0.2.5",
]
rag = [
    "mcp-win-stdio-rag>=0.2.5",
]
excel-db = [
    "mcp-win-stdio-excel-db>=0.2.5",
]
all = [
    "mcp-win-stdio-excel>=0.2.5",
    "mcp-win-stdio-word>=0.2.5",
    "mcp-win-stdio-explorer>=0.2.5",
    "mcp-win-stdio-tsc>=0.2.5",
    "mcp-win-stdio-db>=0.2.5",
    "mcp-win-stdio-git>=0.2.5",
    "mcp-win-stdio-ssh>=0.2.5",
    "mcp-win-stdio-rag>=0.2.5",
    "mcp-win-stdio-excel-db>=0.2.5",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "hatchling>=1.25.0",
]


[project.scripts]
mcp-win-stdio = "mcp_win_stdio.cli:main"
mws = "mcp_win_stdio.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".agents",
    "build",
    "dist",
    "scratch",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E722", "F841", "W293", "W291", "E741", "F401"]


