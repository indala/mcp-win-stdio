[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-win-stdio"
version = "0.3.4"
description = "Universal Windows-optimized Model Context Protocol (MCP) suite & dynamic on-demand tool gateway for AI IDEs and CLI agents (Gemini, Claude, ChatGPT, Cursor, Windsurf, Kiro, OpenCode)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohan Kumar Indala" }
]
keywords = ["mcp", "agent", "windows", "gemini", "claude", "cursor", "chatgpt", "excel", "word", "workspace-explorer", "typescript", "stdio", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
excel = [
    "mcp-win-stdio-excel>=0.3.4",
]
word = [
    "mcp-win-stdio-word>=0.3.4",
]
explorer = [
    "mcp-win-stdio-explorer>=0.3.4",
]
tsc = [
    "mcp-win-stdio-tsc>=0.3.4",
]
db = [
    "mcp-win-stdio-db>=0.3.4",
]
git = [
    "mcp-win-stdio-git>=0.3.4",
]
ssh = [
    "mcp-win-stdio-ssh>=0.3.4",
]
rag = [
    "mcp-win-stdio-rag>=0.3.4",
]
excel-db = [
    "mcp-win-stdio-excel-db>=0.3.4",
]
arch = [
    "mcp-win-stdio-arch>=0.3.4",
]
all = [
    "mcp-win-stdio-excel>=0.3.4",
    "mcp-win-stdio-word>=0.3.4",
    "mcp-win-stdio-explorer>=0.3.4",
    "mcp-win-stdio-tsc>=0.3.4",
    "mcp-win-stdio-db>=0.3.4",
    "mcp-win-stdio-git>=0.3.4",
    "mcp-win-stdio-ssh>=0.3.4",
    "mcp-win-stdio-rag>=0.3.4",
    "mcp-win-stdio-excel-db>=0.3.4",
    "mcp-win-stdio-arch>=0.3.4",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "hatchling>=1.25.0",
]


[project.scripts]
mcp-win-stdio = "mcp_win_stdio.cli:main"
mws = "mcp_win_stdio.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/mcp_win_stdio"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".agents",
    "build",
    "dist",
    "scratch",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E722", "F841", "W293", "W291", "E741", "F401"]

[tool.pyright]
extraPaths = [
    "src",
    "packages/mcp-win-stdio-arch/src",
    "packages/mcp-win-stdio-db/src",
    "packages/mcp-win-stdio-excel/src",
    "packages/mcp-win-stdio-excel-db/src",
    "packages/mcp-win-stdio-explorer/src",
    "packages/mcp-win-stdio-git/src",
    "packages/mcp-win-stdio-rag/src",
    "packages/mcp-win-stdio-ssh/src",
    "packages/mcp-win-stdio-tsc/src",
    "packages/mcp-win-stdio-word/src",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mcp-win-stdio-excel = { workspace = true }
mcp-win-stdio-word = { workspace = true }
mcp-win-stdio-explorer = { workspace = true }
mcp-win-stdio-tsc = { workspace = true }
mcp-win-stdio-db = { workspace = true }
mcp-win-stdio-git = { workspace = true }
mcp-win-stdio-ssh = { workspace = true }
mcp-win-stdio-rag = { workspace = true }
mcp-win-stdio-excel-db = { workspace = true }
mcp-win-stdio-arch = { workspace = true }


