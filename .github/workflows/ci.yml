name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp pyyaml tomli rapidfuzz pathspec openpyxl pandas python-docx psycopg2-binary pymysql paramiko cryptography sqlalchemy playwright networkx numpy build twine pytest hatchling pywin32
          pip install -e .
          pip install -e packages/mcp-win-stdio-excel -e packages/mcp-win-stdio-word -e packages/mcp-win-stdio-explorer -e packages/mcp-win-stdio-tsc -e packages/mcp-win-stdio-db -e packages/mcp-win-stdio-git -e packages/mcp-win-stdio-ssh -e packages/mcp-win-stdio-rag -e packages/mcp-win-stdio-excel-db -e packages/mcp-win-stdio-arch

      - name: Run Test Suite
        run: pytest

  build-validation:
    name: Validate Wheel & Sdist Builds
    runs-on: windows-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine hatchling uv

      - name: Verify uv.lock freshness
        run: uv lock --check

      - name: Build all 11 packages
        run: python scripts/build_all.py

      - name: Validate distribution packages with Twine
        run: twine check dist/*

      - name: Clean Wheel Install & Import Smoke Check
        run: |
          python -m venv .smoke_venv
          .\.smoke_venv\Scripts\python.exe -m pip install --upgrade pip
          Get-ChildItem dist/*.whl | ForEach-Object { .\.smoke_venv\Scripts\python.exe -m pip install --find-links dist $_.FullName }
          .\.smoke_venv\Scripts\python.exe -c "import mcp_win_stdio, mcp_win_stdio.server.server, mcp_win_stdio.arch.server, mcp_win_stdio.db.server, mcp_win_stdio.excel.server, mcp_win_stdio.excel_db.server, mcp_win_stdio.explorer.server, mcp_win_stdio.git.server, mcp_win_stdio.rag.server, mcp_win_stdio.ssh.server, mcp_win_stdio.tsc.server, mcp_win_stdio.word.server; print('All 11 wheels imported cleanly')"

  sdk-min-compat:
    name: MCP SDK Minimum Bound Smoke Check (1.25.0)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum declared MCP SDK & run gateway/import tests
        run: |
          python -m pip install --upgrade pip
          pip install "mcp==1.25.0" jsonschema pyyaml tomli rapidfuzz pathspec openpyxl pandas python-docx psycopg2-binary pymysql paramiko cryptography sqlalchemy playwright networkx numpy pytest hatchling pywin32
          pip install --no-deps -e . -e packages/mcp-win-stdio-excel -e packages/mcp-win-stdio-word -e packages/mcp-win-stdio-explorer -e packages/mcp-win-stdio-tsc -e packages/mcp-win-stdio-db -e packages/mcp-win-stdio-git -e packages/mcp-win-stdio-ssh -e packages/mcp-win-stdio-rag -e packages/mcp-win-stdio-excel-db -e packages/mcp-win-stdio-arch
          pytest tests/test_audit.py tests/test_server.py -q
